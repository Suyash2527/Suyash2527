name: Render Terminal Cards

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 05:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/cards.yml"]

permissions:
  contents: write

concurrency:
  group: readme-writes
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SVG cards
        env:
          # Optional: add a PAT as secret CARDS_TOKEN to include private contributions
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/gen_cards.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh terminal cards"
          git pull --rebase origin main
          git push
